# Builds the NSIS installer and uploads it, its signature and latest.json to the
# GitHub Release for a v* tag. The installed app reads latest.json from the latest
# release (see plugins.updater in tauri.conf.json).
#
# Three ways in:
# - push of a v* tag by a person (the first release, or a manual one);
# - workflow_call from sync-core with inputs tag + sha. A tag pushed with
#   GITHUB_TOKEN starts no push-triggered workflow, so the automatic chain calls
#   this workflow instead of relying on the tag push;
# - workflow_dispatch with an existing tag, to retry a release by hand.
# A called workflow sees the caller's github.ref / github.sha (main before the
# version bump), so the tag and the commit always come from inputs first.
#
# Refuses a tag that is not vX.Y.Z before checkout. After checkout (no code of the
# commit runs before the guards below except the release-state check):
# - a COMPLETE release for the tag (published, with latest.json, the installer and
#   its .sig: .github/scripts/release-state.sh) -> nothing to do, exits green;
#   a draft or a half-uploaded release is removed (the tag stays) and built again;
# - the TAURI_SIGNING_PRIVATE_KEY secret is empty -> refuse (no unsigned update, ever);
# - the tag points at another commit, any of the six version sites differs from the
#   tag, the committed updater pubkey is still the placeholder, or a test signature
#   made with the secret carries a key id other than the committed pubkey's
#   (installed apps would reject that release) -> refuse.
# tauri-action uploads into a DRAFT release, which installed apps never see. The last
# step publishes it only after release-state.sh finds every asset, so
# releases/latest never points at a release without latest.json. A failed guard,
# test or upload publishes nothing; the next run (or a retry) starts over.
#
# One-time setup: repository secret TAURI_SIGNING_PRIVATE_KEY (the updater's
# private key; the matching public key is in tauri.conf.json) and, only if the
# key has a password, TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
# The installer itself is not code-signed: Windows SmartScreen warns on first install.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.1.1
        required: true
        type: string
      # Declared so `inputs.sha` has one type in all three triggers (actionlint); leave it empty.
      # A value that is not the tag's commit is refused by "Tag must point at this commit".
      sha:
        description: Optional; empty = the tag's commit
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: Tag to release, e.g. v0.1.1
        required: true
        type: string
      sha:
        description: Commit the tag points at
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    concurrency:
      group: release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Tag must be vX.Y.Z
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || (inputs.tag && format('refs/tags/{0}', inputs.tag)) || github.sha }}
          submodules: recursive
          persist-credentials: false

      # Released = published WITH latest.json, the installer and its .sig. A release that only
      # exists (a run that died mid-upload, or a draft never published) is built again.
      - name: Already released?
        id: pre
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          out=$(bash .github/scripts/release-state.sh "$TAG")
          echo "$out"
          state=$(sed -n 's/^state=//p' <<<"$out")
          missing=$(sed -n 's/^missing=//p' <<<"$out")
          case "$state" in
            complete)
              echo "::notice::$TAG is already released with all its assets; nothing to do"
              skip=true ;;
            none)
              skip=false ;;
            draft|incomplete)
              echo "::warning::$TAG has a $state release (missing: ${missing:-nothing, unpublished}); it is removed and built again"
              skip=false ;;
            *)
              echo "::error::Could not tell whether $TAG is released (state '$state')"
              exit 1 ;;
          esac
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Signing key must be set
        if: steps.pre.outputs.skip != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; refusing to publish an unsigned update"
            exit 1
          fi

      - name: Tag must point at this commit
        id: head
        if: steps.pre.outputs.skip != 'true'
        run: |
          head=$(git rev-parse HEAD)
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          # The peeled line (^{}) is the commit of an annotated tag; a light tag has only the first.
          remote=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          tagged=$(awk -v t="refs/tags/$TAG" '$2 == t "^{}" { p = $1 } $2 == t { l = $1 } END { print (p != "" ? p : l) }' <<<"$remote")
          if [ -n "$tagged" ] && [ "$tagged" != "$head" ]; then
            echo "::error::Tag $TAG points at $tagged, but this run checked out $head (tag moved?)"
            exit 1
          fi
          echo "Releasing $TAG at $head"

      - name: Tag must match the app version (all six sites)
        if: steps.pre.outputs.skip != 'true'
        run: |
          v=$(node app/scripts/releaseChain.mjs versions)
          if [ "$v" != "${TAG#v}" ]; then
            echo "::error::App version is $v, tag is $TAG"
            exit 1
          fi

      - name: Updater pubkey must not be the placeholder
        if: steps.pre.outputs.skip != 'true'
        run: node app/scripts/releaseChain.mjs pubkey-check

      - uses: actions/setup-node@v4
        if: steps.pre.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        if: steps.pre.outputs.skip != 'true'

      - uses: swatinem/rust-cache@v2
        if: steps.pre.outputs.skip != 'true'
        with:
          workspaces: app/src-tauri

      - name: Install dependencies
        if: steps.pre.outputs.skip != 'true'
        working-directory: app
        run: npm ci

      - name: Signing key must match the committed pubkey
        if: steps.pre.outputs.skip != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          probe="$RUNNER_TEMP/keyid-probe"
          trap 'rm -f "$probe" "$probe.sig"' EXIT
          printf x > "$probe"
          (cd app && npx tauri signer sign "$probe" > /dev/null)
          node app/scripts/releaseChain.mjs keyid-match "$probe.sig"

      - name: Test
        if: steps.pre.outputs.skip != 'true'
        working-directory: app
        run: npm test

      - name: Rust tests
        if: steps.pre.outputs.skip != 'true'
        working-directory: app/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc

      # Right before the build, after every guard and test passed. The tag stays (no --cleanup-tag).
      - name: Remove the incomplete release
        if: steps.pre.outputs.skip != 'true' && steps.pre.outputs.state != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete "$TAG" --yes

      - name: Build, sign and upload to a draft release
        if: steps.pre.outputs.skip != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ env.TAG }}
          releaseName: labnoteO ${{ env.TAG }}
          releaseBody: "Windows installer (unsigned: SmartScreen will warn on first install)."
          commitish: ${{ steps.head.outputs.sha }}
          # A draft is invisible to installed apps (releases/latest skips drafts) until the step below publishes it.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # Updater artifacts need the private key, so only the release build asks for them.
          args: --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Check every asset, then publish the release
        if: steps.pre.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          out=$(bash .github/scripts/release-state.sh "$TAG")
          echo "$out"
          state=$(sed -n 's/^state=//p' <<<"$out")
          if [ "$state" != draft ]; then
            echo "::error::The draft release for $TAG is not ready to publish (state '$state'; $(grep '^missing=' <<<"$out" || true)); it stays unpublished and the next run builds it again"
            exit 1
          fi
          # A retried or by-hand release of an older tag must not take "latest" from a newer one:
          # installed apps read latest.json from releases/latest.
          if ! git fetch --force --tags origin; then
            echo "::error::Could not fetch the tags to tell whether $TAG is the newest release; $TAG stays a draft"
            exit 1
          fi
          NEWEST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          latest=
          if [ "$TAG" != "$NEWEST" ]; then
            latest=--latest=false
            echo "$TAG is older than $NEWEST; publishing it without marking it latest"
          fi
          gh release edit "$TAG" --draft=false $latest
          out=$(bash .github/scripts/release-state.sh "$TAG")
          state=$(sed -n 's/^state=//p' <<<"$out")
          if [ "$state" != complete ]; then
            echo "::error::$TAG was published but reads back as '$state'"
            exit 1
          fi
          echo "Published $TAG with latest.json, the installer and its signature"
