[package]
name = "labnoteo-app"
version = "0.1.0"
edition = "2021"
description = "labnoteO desktop lab notebook"
license = "Apache-2.0"

[lib]
name = "labnoteo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
# The search index needs SQLite's FTS5 (trigram tokenizer). rusqlite 0.41 has no
# `fts5` feature to pin: the "bundled" build compiles SQLite through
# libsqlite3-sys, whose build.rs always passes -DSQLITE_ENABLE_FTS5. That
# implicit default is what this relies on; `schema::open` fails loudly (and the
# schema tests go red) if a libsqlite3-sys upgrade ever drops it.
rusqlite = { version = "0.41.1", features = ["bundled"] }
notify = "8"
# User-visible deletes go to the Windows Recycle Bin (`vault_trash`), never a permanent delete.
trash = "5"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
