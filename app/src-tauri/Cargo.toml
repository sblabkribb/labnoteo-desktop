[package]
name = "labnoteo-app"
version = "0.1.0"
edition = "2021"
description = "labnoteO desktop lab notebook"
license = "Apache-2.0"

[lib]
name = "labnoteo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
# The search index needs SQLite's FTS5 (trigram tokenizer). rusqlite 0.41 has no
# `fts5` feature to pin: the "bundled" build compiles SQLite through
# libsqlite3-sys, whose build.rs always passes -DSQLITE_ENABLE_FTS5. That
# implicit default is what this relies on; `schema::open` fails loudly (and the
# schema tests go red) if a libsqlite3-sys upgrade ever drops it.
rusqlite = { version = "0.41.1", features = ["bundled"] }
notify = "8"
# User-visible deletes go to the Windows Recycle Bin (`vault_trash`), never a permanent delete.
trash = "5"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
# One HTTP client for every integration; the same features tauri-plugin-updater already builds (no new TLS stack).
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["sync", "macros", "time", "rt", "net", "io-util"] }
# API keys live only in Windows Credential Manager (USER RULE).
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
futures-util = "0.3"
# MCP server (SP7 Part C): loopback HTTP/1.1, already in the lock through reqwest.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"
subtle = "2.6"
getrandom = "0.2"
socket2 = "0.6"
# Copy the MCP token from Rust, excluded from clipboard history (USER RULE: the webview never sees it).
arboard = { version = "=3.6.1", default-features = false }
# Chat history file keys (assistant spec §6.1); 0.10.9 is already in the lock.
sha2 = "0.10"
# Readable text for the assistant's fetch_page (assistant spec §7.2); shares the
# lock's dom_query 0.28.0 with tauri-utils.
dom_smoothie = "=0.18.0"

[features]
# Never in `default`, release or CI builds (guarded by src/__tests__/releaseFeatures.test.ts):
# lets the test exe's fetch_page reach exactly the loopback ports listed in
# LABNOTEO_E2E_FAKE_PORTS (the fake web pages of the real-app check).
e2e-fakes = []

[target.'cfg(windows)'.dependencies]
# SO_EXCLUSIVEADDRUSE on the MCP listener (C2); 0.61.2 is already in the lock.
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
